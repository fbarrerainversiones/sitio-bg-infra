<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Barrera Global">
  <!--
    Logo Barrera Global — portico P3 "Arquitectonica" (decision D-29),
    version cuadrada limpia, sin fondo.

    Geometria IDENTICA a docs/marca/brand-propuestas/p3-arquitectonica-cuadrado.svg:
    los 9 trazos originales, mismas coordenadas, mismo grosor 1.4. Aca SI va el
    portico completo (con arquitrabe y doble basamento) porque este archivo se usa
    a tamano grande, no en una pestana.

    Unico cambio respecto de la fuente: se quita vector-effect="non-scaling-stroke",
    que congelaba el trazo en 1.4 px a cualquier escala y dejaba el logo como un
    hilo cuando se lo mostraba a 512 px. Sin el, el trazo escala con la pieza.

    Lo referencia el JSON-LD de Layout.astro (campo "logo" de InsuranceAgency).
  -->
  <g fill="none" stroke="#c9a84c" stroke-width="1.4" stroke-linecap="square">
    <polyline points="18,44 50,22 82,44"/>
    <line x1="18" y1="44" x2="82" y2="44"/>
    <line x1="23" y1="51" x2="77" y2="51"/>
    <line x1="30" y1="51" x2="30" y2="82"/>
    <line x1="43" y1="51" x2="43" y2="82"/>
    <line x1="57" y1="51" x2="57" y2="82"/>
    <line x1="70" y1="51" x2="70" y2="82"/>
    <line x1="23" y1="82" x2="77" y2="82"/>
    <line x1="18" y1="87" x2="82" y2="87"/>
  </g>
</svg>
