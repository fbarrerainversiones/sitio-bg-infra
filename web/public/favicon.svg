<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Barrera Global">
  <!--
    Favicon Barrera Global — portico P3 "Arquitectonica" (decision D-29).

    Geometria DERIVADA de docs/marca/brand-propuestas/p3-arquitectonica-cuadrado.svg,
    no reinventada: mismo portico (fronton, dintel, 4 columnas, basamento), misma
    proporcion, escalado 1.08 alrededor de su centro para llenar ~75% del cuadro.

    Simplificaciones deliberadas para 16-32 px (el original es de linea fina y a
    ese tamano se funde):
      - se colapsan el arquitrabe (y=51) contra el dintel (y=44) y la segunda
        linea de basamento (y=87) contra la primera: a 16 px quedaban a menos de
        1 px una de otra y se leian como una sola barra gruesa.
      - el trazo sube de 1.4 a 5.4 unidades (~0.9 px a 16 px, ~1.7 px a 32 px);
        con 1.4 el icono desaparecia.
      - SIN vector-effect="non-scaling-stroke": el trazo debe escalar con el icono.

    Fondo: cuadrado redondeado #08080d. Un portico dorado sobre transparente se
    pierde en pestanas de tema claro.
  -->
  <rect width="100" height="100" rx="22" fill="#08080d"/>
  <g fill="none" stroke="#c9a84c" stroke-width="5.4" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Fronton como triangulo CERRADO, no como polilinea + linea suelta: con
         dos trazos separados los remates a tope del talud no cierran la esquina
         contra el dintel y queda una muesca visible a 180 px. -->
    <path d="M15.4 39.7 L50 16 L84.6 39.7 Z"/>
    <line x1="28.4" y1="46.2" x2="28.4" y2="80.8"/>
    <line x1="42.4" y1="46.2" x2="42.4" y2="80.8"/>
    <line x1="57.6" y1="46.2" x2="57.6" y2="80.8"/>
    <line x1="71.6" y1="46.2" x2="71.6" y2="80.8"/>
    <line x1="15.4" y1="84" x2="84.6" y2="84"/>
  </g>
</svg>
