# ============================================================
# nginx endurecido — sitio estatico Barrera Global
# Se copia a /etc/nginx/conf.d/default.conf dentro de la imagen.
#
# TLS: lo termina el Caddy compartido del VPS. Este nginx corre
# NON-ROOT (imagen nginx unprivileged) y solo escucha en el puerto
# interno 8080 de la red Docker sitio_bg_net; NO abre puerto en el
# host (Regla 4). El Caddy compartido debe enrutar a sitio-bg-web:8080.
# ============================================================

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # No exponer la version de nginx en la cabecera Server.
    server_tokens off;

    # ------------------------------------------------------------
    # Redirecciones RELATIVAS (bug del 05/08/2026)
    #   Sintoma: al entrar a /seguros/vida-termino el navegador saltaba a
    #   staging.barreraglobal.com:8080 y moria con ERR_CONNECTION_RESET.
    #   Causa: el "location /" resuelve la ruta sin barra final con
    #   'try_files $uri $uri/', y al caer en el directorio nginx emite un
    #   301 hacia /ruta/. Con los defaults (absolute_redirect on,
    #   port_in_redirect on) ese Location se arma como URL ABSOLUTA con el
    #   Host proxiado + el puerto en el que ESTE nginx escucha: el 8080
    #   interno. Ese puerto no existe de cara al navegador (no se publica
    #   al host, Regla 4) y el Caddy compartido no reescribe Location.
    #   Fix: emitir el Location como ruta relativa ('/ruta/'), sin esquema,
    #   sin host y sin puerto. Asi el navegador lo resuelve contra el
    #   origen publico y el 8080 nunca se filtra.
    # ------------------------------------------------------------
    absolute_redirect off;
    port_in_redirect  off;

    # ------------------------------------------------------------
    # Cabeceras de seguridad
    #   'always' -> tambien en respuestas 4xx/5xx.
    #   Se definen a nivel server y se HEREDAN a los location que NO
    #   declaran su propio add_header. Por eso los location de cache
    #   usan solo 'expires' (no add_header): si agregaramos add_header
    #   ahi, nginx dejaria de heredar estas cabeceras en ese location.
    # ------------------------------------------------------------
    add_header X-Frame-Options        "DENY"                              always;
    add_header X-Content-Type-Options "nosniff"                           always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
    # autoplay=(self) — CORREGIDO el 11/08/2026 (Sesion 16). Estaba en
    #   `autoplay=()`, allowlist VACIA. MDN: una allowlist vacia "grants
    #   permission to no origins" —el propio origen INCLUIDO— y entonces "the
    #   autoplay attribute on <audio> and <video> elements will be ignored".
    #   O sea: los dos videos de fondo se habrian quedado congelados en su
    #   poster, sin reproducir nunca. Es el SEGUNDO asesino silencioso del
    #   video de esta sesion, independiente del `media-src` que faltaba.
    #   `(self)` es ademas el valor por DEFECTO de la directiva: la cabecera
    #   queda igual de restrictiva para terceros y solo deja de bloquearse a
    #   si misma. Todo lo demas de la lista sigue en allowlist vacia.
    add_header Permissions-Policy     "accelerometer=(), autoplay=(self), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

    # Content-Security-Policy — default-src 'none' y se abre lo minimo.
    #
    # media-src 'self' — AGREGADO el 11/08/2026 (Sesion 16), y no es opcional.
    #   La politica declara `default-src 'none'` y NO declaraba `media-src`.
    #   Por spec, `media-src` no tiene valor propio: cae en `default-src`, o
    #   sea 'none'. Con los <video> de F2 (hero del home) y F3 (/sobre-mi), el
    #   navegador habria BLOQUEADO /videos/hero2.mp4 y /videos/sobre-mi-loop.mp4
    #   y el visitante habria visto el poster estatico para siempre, con el
    #   error solo en la consola. Otro fallo en silencio, como el hash CSP que
    #   no cuadra o el `sed -i` sobre un bind-mount.
    #   Los DOS hashes sha256 de script-src NO se tocaron: siguen siendo
    #   exactamente los mismos y el cruce con el build sigue dando 2 <-> 2.
    #   Como todo lo que vive en este archivo, EXIGE REBUILD de la imagen: el
    #   git pull no lo aplica (R-44).
    # Los dos 'sha256-...' de script-src son los 2 <script type="module">
    # inline que genera Astro (toggle del menu movil + IntersectionObserver
    # del scroll-reveal). Si esos scripts cambian, REGENERAR los hashes
    # (ver infra/README-hashes o el comando en el reporte).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-aOPTArMuUPr5ybUMJpH+mtSGicP8zlnwwFwZYYhokv4=' 'sha256-Qra3eTJV60gng4dzuHtxcR7XY8lE1nLbTAAJ5T7jyto='; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; upgrade-insecure-requests" always;

    # HSTS: NO se define aqui. El TLS lo termina el Caddy compartido del
    # VPS, que es donde debe vivir Strict-Transport-Security. No duplicar
    # para evitar cabeceras contradictorias.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ------------------------------------------------------------
    # Compresion
    # ------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    application/manifest+json image/svg+xml application/xml text/xml;

    # ------------------------------------------------------------
    # Cache
    #   /_astro/* -> assets con hash de contenido: cache larga.
    #   /images/  -> sin hash: cache media.
    #   HTML      -> sin cache (revalidar) para ver cambios al toque.
    #   (ningun location usa add_header, para heredar las cabeceras de seguridad)
    # ------------------------------------------------------------
    location /_astro/ {
        expires    1y;
        access_log off;
    }

    location /images/ {
        expires    30d;
        access_log off;
    }

    location = /favicon.svg { expires 30d; access_log off; }
    location = /favicon.ico { expires 30d; access_log off; }

    # ------------------------------------------------------------
    # Pagina 404 propia (P-42, 08/08/2026)
    #   Sintoma: la 404 premium existia (web/src/pages/404.astro ->
    #   dist/404.html) pero nginx nunca la servia: el 'try_files ... =404'
    #   de abajo levanta un 404 INTERNO y, sin 'error_page', nginx
    #   responde con su pagina de error empotrada (texto pelado, sin
    #   marca y sin salida de navegacion).
    #   Fix: mapear el 404 al /404.html del build.
    #   Notas:
    #     - Sin el prefijo '=' el status de la respuesta sigue siendo 404
    #       (no 200): los buscadores no indexan la pagina de error.
    #     - El redirect interno cae en el 'location /' de abajo, asi que
    #       /404.html se sirve con 'expires -1' y hereda las cabeceras de
    #       seguridad + CSP declaradas arriba con 'always' (que es lo que
    #       hace que tambien salgan en respuestas 4xx).
    #     - Vive DENTRO de la imagen Docker (Dockerfile copia este
    #       archivo): exige REBUILD en el VPS, no basta el git pull (R-44).
    # ------------------------------------------------------------
    error_page 404 /404.html;

    # HTML y ruteo de paginas (Astro genera /ruta/index.html).
    location / {
        try_files $uri $uri/ =404;
        expires   -1;
    }
}
