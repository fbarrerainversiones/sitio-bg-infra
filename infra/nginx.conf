# ============================================================
# nginx endurecido — sitio estatico Barrera Global
# Se copia a /etc/nginx/conf.d/default.conf dentro de la imagen.
#
# TLS: lo termina el Caddy compartido del VPS. Este nginx corre
# NON-ROOT (imagen nginx unprivileged) y solo escucha en el puerto
# interno 8080 de la red Docker sitio_bg_net; NO abre puerto en el
# host (Regla 4). El Caddy compartido debe enrutar a sitio-bg-web:8080.
# ============================================================

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # No exponer la version de nginx en la cabecera Server.
    server_tokens off;

    # ------------------------------------------------------------
    # Cabeceras de seguridad
    #   'always' -> tambien en respuestas 4xx/5xx.
    #   Se definen a nivel server y se HEREDAN a los location que NO
    #   declaran su propio add_header. Por eso los location de cache
    #   usan solo 'expires' (no add_header): si agregaramos add_header
    #   ahi, nginx dejaria de heredar estas cabeceras en ese location.
    # ------------------------------------------------------------
    add_header X-Frame-Options        "DENY"                              always;
    add_header X-Content-Type-Options "nosniff"                           always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy     "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

    # Content-Security-Policy — default-src 'none' y se abre lo minimo.
    # Los dos 'sha256-...' de script-src son los 2 <script type="module">
    # inline que genera Astro (toggle del menu movil + IntersectionObserver
    # del scroll-reveal). Si esos scripts cambian, REGENERAR los hashes
    # (ver infra/README-hashes o el comando en el reporte).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-IpuDn/ODXnvlsW4BOK3Y58F0Qf1lmA9OPQHicTjTPos=' 'sha256-Qra3eTJV60gng4dzuHtxcR7XY8lE1nLbTAAJ5T7jyto='; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; upgrade-insecure-requests" always;

    # HSTS: NO se define aqui. El TLS lo termina el Caddy compartido del
    # VPS, que es donde debe vivir Strict-Transport-Security. No duplicar
    # para evitar cabeceras contradictorias.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ------------------------------------------------------------
    # Compresion
    # ------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    application/manifest+json image/svg+xml application/xml text/xml;

    # ------------------------------------------------------------
    # Cache
    #   /_astro/* -> assets con hash de contenido: cache larga.
    #   /images/  -> sin hash: cache media.
    #   HTML      -> sin cache (revalidar) para ver cambios al toque.
    #   (ningun location usa add_header, para heredar las cabeceras de seguridad)
    # ------------------------------------------------------------
    location /_astro/ {
        expires    1y;
        access_log off;
    }

    location /images/ {
        expires    30d;
        access_log off;
    }

    location = /favicon.svg { expires 30d; access_log off; }
    location = /favicon.ico { expires 30d; access_log off; }

    # HTML y ruteo de paginas (Astro genera /ruta/index.html).
    location / {
        try_files $uri $uri/ =404;
        expires   -1;
    }
}
