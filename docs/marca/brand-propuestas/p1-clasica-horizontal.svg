  <defs>
    <style>
      @font-face{font-family:'Cormorant Garamond';src:url('./fonts/cormorant-garamond-latin-600-normal.woff2') format('woff2');font-weight:600;font-display:swap;}
      @font-face{font-family:'JetBrains Mono';src:url('./fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2');font-weight:400;font-display:swap;}
